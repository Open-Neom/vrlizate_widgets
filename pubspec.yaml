name: vrlizate_widgets
description: Reusable 3D controls and world-anchored action panels for Flutter
  GPU scenes, with gaze, laser and gamepad focus routing.
version: 0.3.1
homepage: https://github.com/Open-Neom/vrlizate_widgets
repository: https://github.com/Open-Neom/vrlizate_widgets
issue_tracker: https://github.com/Open-Neom/vrlizate_widgets/issues

platforms:
  android:
  ios:
  macos:
  windows:
  linux:

environment:
  sdk: ^3.10.0
  # Requires a runtime compatible with Flutter GPU and flutter_scene.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.22.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
